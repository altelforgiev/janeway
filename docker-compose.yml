version: "3"

services:

  janeway-postgres:
    image: postgres:15
    volumes:
      - ./db/postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    environment:
      - "POSTGRES_PASSWORD=${DB_PASSWORD}"
      - "POSTGRES_USER=${DB_USER}"
      - "POSTGRES_DB=${DB_NAME}"

  janeway-pgadmin:
    image: dpage/pgadmin4
    user: root
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - ./db/pgadmin:/var/lib/pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=dev@janeway.systems
      - "PGADMIN_DEFAULT_PASSWORD=${DB_PASSWORD}"
      - PG_ADMIN_LISTEN_ADDRESS=0.0.0.0
      - GUNICORN_THREADS=2
      - PGADMIN_SERVER_JSON_FILE=/var/lib/pgadmin/servers.json
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    depends_on:
      - janeway-postgres

  start_dependencies:
    image: dadarek/wait-for-dependencies
    depends_on:
     - janeway-postgres
     - janeway-debug-smtp
    command: "janeway-${DB_VENDOR}:${DB_PORT}"

  janeway-web:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    volumes:
      - ./src:/vol/janeway/src
      - ./lib:/vol/janeway/lib
      - ./logs:/vol/janeway/logs
    ports:
      - "${JANEWAY_PORT}:8000"
    env_file:
      - .env
    environment:
      - JANEWAY_SETTINGS_MODULE=core.custom_settings
    depends_on:
      - "start_dependencies"
    cap_add:
      - SYS_PTRACE

  janeway-debug-smtp:
    image: python:3.8
    entrypoint: python -u -m smtpd -c DebuggingServer -n 0.0.0.0:1025