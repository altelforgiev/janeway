{% block js %}
{# Hybrid Map Script: Equal Earth for Desktop, Smooth 110m Orthographic Globe with Heatmap for Mobile #}
<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const container = document.getElementById("journal-world-map");
    if (!container || typeof d3 === "undefined") return;

    const mapTranslations = { views: "{% trans 'Views' %}" };
    const tooltip = d3.select("body").append("div").attr("class", "d3-tooltip");

    const isMobile = window.innerWidth <= 768;
    const width = isMobile ? 600 : 800;
    const height = isMobile ? 600 : 400;
    const baseGlobeScale = 280;

    const svg = d3.select("#journal-world-map")
        .append("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .attr("preserveAspectRatio", "xMidYMid meet")
        .attr("class", isMobile ? "is-mobile-globe" : "is-desktop-map");

    let currentZoomScale = 1;

    const mapGroup = svg.append("g");

    {# Multi-stop radial gradient: subtle core point + delicate outer glow #}
    const defs = svg.append("defs");
    const radialGradient = defs.append("radialGradient")
        .attr("id", "heat-glow")
        .attr("cx", "50%")
        .attr("cy", "50%")
        .attr("r", "50%");
    radialGradient.append("stop").attr("offset", "0%").attr("stop-color", "rgba(255, 255, 255, 0.85)");
    radialGradient.append("stop").attr("offset", "15%").attr("stop-color", "rgba(200, 16, 46, 0.7)");
    radialGradient.append("stop").attr("offset", "35%").attr("stop-color", "rgba(200, 16, 46, 0.18)");
    radialGradient.append("stop").attr("offset", "100%").attr("stop-color", "rgba(200, 16, 46, 0)");

    let projection;
    let spherePath = null;

    if (isMobile) {
        document.getElementById("mobile-swipe-hint").style.display = "block";
        projection = d3.geoOrthographic()
            .scale(baseGlobeScale)
            .translate([width / 2, height / 2])
            .rotate([-70, -30])
            .clipAngle(90)
            .precision(0.3);

        spherePath = mapGroup.append("path")
            .datum({type: "Sphere"})
            .attr("class", "d3-sphere")
            .attr("d", d3.geoPath().projection(projection));
    } else {
        projection = d3.geoEqualEarth()
            .scale(145)
            .translate([width / 2, height / 2]);
    }

    const path = d3.geoPath().projection(projection);

    const graticuleGenerator = isMobile ? d3.geoGraticule().step([20, 20]) : d3.geoGraticule();
    const graticulePath = mapGroup.append("path")
        .datum(graticuleGenerator())
        .attr("class", "d3-graticule")
        .attr("d", path);

    const geoJsonUrl = isMobile
        ? "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson"
        : "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson";

    Promise.all([
        fetch('/api/map-data/').then(r => r.json()),
        d3.json(geoJsonUrl)
    ]).then(([statData, geoData]) => {
        const countryData = statData.countries || {};
        const rawCities = statData.cities || statData.markers || [];

        const citiesData = rawCities.map(d => ({
            name: d.name || "",
            coords: d.coords,
            count: d.count !== undefined ? d.count : (d.views || 1)
        })).filter(d => Array.isArray(d.coords) && d.coords.length === 2);

        const maxViews = d3.max(Object.values(countryData)) || 1;
        const colorScale = d3.scaleLinear()
            .domain([0, maxViews])
            .range(['#b3d4f0', '#003d71']);

        {# Set minimum ceiling of 50 views so 10 views remain compact #}
        const maxCityViews = Math.max(50, d3.max(citiesData, d => d.count) || 1);
        const baseRadiusScale = d3.scaleSqrt()
            .domain([1, maxCityViews])
            .range([3, 10]);

        const getCountryCode = d => {
            const p = d.properties;
            if (p.ISO_A2 && p.ISO_A2 !== "-99") return p.ISO_A2;
            return p.ISO_A2_EH || p["ISO3166-1-Alpha-2"] || p.WB_A2;
        };

        const getCountryName = d => d.properties.ADMIN || d.properties.NAME || d.properties.name;

        {# Draw countries #}
        const countryPaths = mapGroup.selectAll(".d3-country")
            .data(geoData.features)
            .enter().append("path")
            .attr("class", "d3-country")
            .attr("d", path)
            .attr("fill", d => {
                const code = getCountryCode(d);
                return countryData[code] ? colorScale(countryData[code]) : 'var(--map-empty-fill)';
            });

        {# Draw heat spots for cities #}
        const heatSpots = mapGroup.selectAll(".heat-spot")
            .data(citiesData)
            .enter().append("circle")
            .attr("class", "heat-spot")
            .attr("fill", "url(#heat-glow)")
            .style("pointer-events", "none");

        {# Update spot positions, visibility, and scale-adjusted radius #}
        const updateSpots = () => {
            heatSpots
                .attr("cx", d => {
                    const p = projection(d.coords);
                    return p ? p[0] : -1000;
                })
                .attr("cy", d => {
                    const p = projection(d.coords);
                    return p ? p[1] : -1000;
                })
                .attr("r", d => {
                    const baseR = baseRadiusScale(d.count);
                    if (isMobile) {
                        return baseR * Math.sqrt(currentZoomScale);
                    }
                    return baseR / Math.sqrt(currentZoomScale);
                })
                .style("display", d => {
                    if (!isMobile) return "block";
                    return path({type: "Point", coordinates: d.coords}) ? "block" : "none";
                });
        };

        updateSpots();

        if (!isMobile) {
            {# Desktop zoom and pan #}
            const zoom = d3.zoom()
                .scaleExtent([1, 8])
                .translateExtent([[0, 0], [width, height]])
                .on("zoom", function(event) {
                    currentZoomScale = event.transform.k;
                    mapGroup.attr("transform", event.transform);
                    countryPaths.style("stroke-width", `${0.5 / currentZoomScale}px`);
                    graticulePath.style("stroke-width", `${0.8 / currentZoomScale}px`);
                    updateSpots();
                });

            svg.call(zoom);

            countryPaths
                .on("mouseover", function(event, d) {
                    const code = getCountryCode(d);
                    const countryName = getCountryName(d);
                    const views = countryData[code] || 0;

                    tooltip.transition().duration(200).style("opacity", 1);
                    tooltip.html(`<strong>${countryName}</strong><br/>${mapTranslations.views}: ${views}`)
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mousemove", function(event) {
                    tooltip
                        .style("left", (event.pageX + 15) + "px")
                        .style("top", (event.pageY - 28) + "px");
                })
                .on("mouseout", function() {
                    tooltip.transition().duration(500).style("opacity", 0);
                });
        } else {
            {# Mobile tap tooltip #}
            countryPaths.on("click", function(event, d) {
                const code = getCountryCode(d);
                const countryName = getCountryName(d);
                const views = countryData[code] || 0;

                tooltip.transition().duration(150).style("opacity", 1);
                tooltip.html(`<strong>${countryName}</strong><br/>${mapTranslations.views}: ${views}`)
                    .style("left", Math.min(window.innerWidth - 160, Math.max(10, event.pageX - 60)) + "px")
                    .style("top", (event.pageY - 50) + "px");
            });

            let renderFrame = null;
            let inertiaFrame = null;
            let vx = 0;
            let vy = 0;
            let lastMoveTime = 0;
            const friction = 0.94;

            const redrawGlobe = () => {
                if (spherePath) spherePath.attr("d", path);
                graticulePath.attr("d", path);
                countryPaths.attr("d", path);
                updateSpots();
                renderFrame = null;
            };

            const stopInertia = () => {
                if (inertiaFrame) {
                    cancelAnimationFrame(inertiaFrame);
                    inertiaFrame = null;
                }
            };

            const startInertia = () => {
                const step = () => {
                    vx *= friction;
                    vy *= friction;

                    if (Math.abs(vx) < 0.04 && Math.abs(vy) < 0.04) {
                        inertiaFrame = null;
                        svg.classed("is-dragging", false);
                        return;
                    }

                    const rotate = projection.rotate();
                    const nextLat = Math.max(-65, Math.min(65, rotate[1] + vy));
                    projection.rotate([rotate[0] + vx, nextLat]);

                    graticulePath.attr("d", path);
                    countryPaths.attr("d", path);
                    updateSpots();

                    inertiaFrame = requestAnimationFrame(step);
                };
                inertiaFrame = requestAnimationFrame(step);
            };

            {# Single-finger drag for rotation with inertia #}
            const drag = d3.drag()
                .filter(event => !event.touches || event.touches.length < 2)
                .on("start", function() {
                    stopInertia();
                    vx = 0;
                    vy = 0;
                    lastMoveTime = performance.now();
                    svg.classed("is-dragging", true);
                    tooltip.style("opacity", 0);
                })
                .on("drag", function(event) {
                    const rotate = projection.rotate();
                    const k = 75 / projection.scale();
                    const dLon = event.dx * k;
                    const dLat = -event.dy * k;
                    const nextLat = Math.max(-65, Math.min(65, rotate[1] + dLat));

                    vx = vx * 0.3 + dLon * 0.7;
                    vy = vy * 0.3 + dLat * 0.7;
                    lastMoveTime = performance.now();

                    projection.rotate([rotate[0] + dLon, nextLat]);

                    if (!renderFrame) {
                        renderFrame = requestAnimationFrame(redrawGlobe);
                    }
                })
                .on("end", function() {
                    if (performance.now() - lastMoveTime < 100 && (Math.abs(vx) > 0.15 || Math.abs(vy) > 0.15)) {
                        startInertia();
                    } else {
                        svg.classed("is-dragging", false);
                    }
                });

            {# Pinch-to-zoom support on mobile globe #}
            const mobileZoom = d3.zoom()
                .scaleExtent([1, 4])
                .filter(event => event.type === "wheel" || (event.touches && event.touches.length >= 2))
                .on("zoom", function(event) {
                    stopInertia();
                    currentZoomScale = event.transform.k;
                    projection.scale(baseGlobeScale * currentZoomScale);
                    if (!renderFrame) {
                        renderFrame = requestAnimationFrame(redrawGlobe);
                    }
                });

            svg.call(drag).call(mobileZoom);
        }

    }).catch(error => console.error('Map loading error:', error));
});
</script>
{% endblock js %}
